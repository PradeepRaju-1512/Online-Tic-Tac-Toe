<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header class="topbar">
<h1>TIC TAC TOE</h1>
<span class="server-status" id="serverStatus">Not connected</span>
</header>
<!--Checking if it is connected to server or not through server status. -->
<main>
<section id="lobby" class="panel">
<h2>Play With Friends</h2>
<p class="subtitle">Create a room or join your friend's room.</p>
<!--Creating own room or joining others room.-->
<form id="usernameForm">
<label for="username">Your username</label><!--Enter/Edit your username. -->
<div class="input-row">
<input id="username" type="text" maxlength="20" placeholder="Enter username" required>
<button type="submit" class="secondary-btn">Save Name</button>
</div>
</form>
<div class="lobby-card">
<h3>Create a Room</h3>
<p>Start a new game and invite one friend.</p>
<button id="createRoomBtn" class="primary-btn">Create Room</button>
</div>
<div class="separator"><span>OR JOIN A FRIEND</span></div>
<form id="joinForm" class="lobby-card">
<h3>Join a Room</h3><!-- Option to join a room through room ID. -->
<label for="roomInput">Room ID</label>
<input id="roomInput" type="text" maxlength="32" placeholder="Enter Room ID" required>
<button type="submit" class="primary-btn">Join Room</button>
</form>

<p id="lobbyMessage" class="message" role="status"></p>
</section>

<section id="gameScreen" class="panel hidden">
<div class="room-header">
<div>
<span class="muted-label">ROOM ID</span>
<div class="room-id-row">
<strong id="roomIdDisplay">--------</strong>
<button id="copyRoomBtn" class="small-btn" type="button">Copy</button>
</div>
</div>
<button id="backBtn" class="secondary-btn" type="button">Leave Room</button>
</div>

<div class="players">
<div class="player-card" id="playerXCard">
<div class="symbol symbol-x">X</div>
<div class="player-info">
<strong id="playerXName">Waiting for player</strong>
<span id="playerXStatus">Host · X</span>
</div>
<span class="player-indicator" id="playerXIndicator"></span>
</div>

<div class="player-card" id="playerOCard">
<div class="symbol symbol-o">O</div>
<div class="player-info">
<strong id="playerOName">Waiting for player</strong>
<span id="playerOStatus">Opponent · O</span>
</div>
<span class="player-indicator" id="playerOIndicator"></span>
</div>
</div>

<div class="game-status" id="gameStatus" role="status">Waiting for opponent</div>

<div class="board" id="board" aria-label="Tic Tac Toe board">
<button class="cell" data-index="0" aria-label="Square 1"></button>
<button class="cell" data-index="1" aria-label="Square 2"></button>
<button class="cell" data-index="2" aria-label="Square 3"></button>
<button class="cell" data-index="3" aria-label="Square 4"></button>
<button class="cell" data-index="4" aria-label="Square 5"></button>
<button class="cell" data-index="5" aria-label="Square 6"></button>
<button class="cell" data-index="6" aria-label="Square 7"></button>
<button class="cell" data-index="7" aria-label="Square 8"></button>
<button class="cell" data-index="8" aria-label="Square 9"></button>
</div>

<div class="game-actions">
<button id="rematchBtn" class="primary-btn" type="button">Rematch</button>
<button id="exitBtn" class="exit-btn" type="button">Exit Game</button>
</div>
<p id="gameMessage" class="message" role="status"></p>
<div class="edit-name">
<button id="editNameBtn" class="text-btn" type="button">Edit username</button>
<form id="editNameForm" class="hidden">
<label for="newUsername">New username</label>
<div class="input-row">
<input id="newUsername" type="text" maxlength="20" required>
<button class="secondary-btn" type="submit">Save</button>
</div>
</form>
</div>
</section>
</main>
<footer>Local multiplayer</footer>
</div>
<script src="script.js"></script>
</body>
</html>
